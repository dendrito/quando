<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><meta name="color-scheme" content="dark"><title>Quando Beta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;800&display=swap">
<style>
/* Quando?'s own palette (lib/app/theme.dart): plum ground, cream text, coral and amber. */
:root{--ground:#1B1020;--night:#120A16;--surface:#2E1B33;--raised:#3D2544;--line:#5A3A55;--text:#FFF4E6;--muted:#CDB8C9;--faint:#9C8399;--blush:#F3C9B8;--coral:#FF6B4A;--amber:#FFB547;--ok:#7FD9A6;--android:#7FD9A6;--ios:#8DB8FF;--ipad:#FFB547;--mac:#C9A2FF}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ground);color:var(--text);font:15px/1.45 "Bricolage Grotesque",system-ui,-apple-system,sans-serif;font-weight:500}
.sky{background:radial-gradient(120% 140% at 85% 120%,#FF8A5C 0%,rgba(255,107,74,.55) 28%,rgba(255,181,71,.12) 48%,transparent 70%),linear-gradient(180deg,var(--night),var(--ground));padding:28px 20px 56px}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(2.4rem,7vw,3.6rem);line-height:1;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{margin-top:8px;color:var(--blush);font-size:.9rem;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(127,217,166,.18)}
.btn,.pill{font:inherit;font-weight:600;border:0;border-radius:99px;padding:9px 18px;cursor:pointer;color:var(--text);background:var(--raised)}
.btn.go{background:var(--coral);color:#2A0F0A}
.pill{font-size:.85rem;padding:7px 15px}
.btn:hover,.pill:hover{filter:brightness(1.12)}
.btn:focus-visible,.pill:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
main{max-width:1100px;margin:-36px auto 0;padding:0 20px 64px}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.tile{background:var(--surface);border-radius:20px;padding:16px 16px 14px;border:1px solid rgba(255,255,255,.04)}
.lab{color:var(--blush);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.val{font-size:2.3rem;font-weight:800;line-height:1.1;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.val small{font-size:1rem;color:var(--faint);font-weight:600}
.meter{position:relative;height:6px;border-radius:99px;background:var(--raised)}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.7;border-radius:2px}
.tgt{margin-top:8px;color:var(--faint);font-size:.78rem}
.met .val{color:var(--ok)}.met .meter i{background:var(--ok)}
.miss .val{color:var(--coral)}.miss .meter i{background:var(--coral)}
.none .val{color:var(--faint)}
.hero{display:flex;align-items:center;gap:10px;margin:14px 2px 0;color:var(--muted)}
.hero strong{color:var(--text);font-weight:800}
h2{margin:36px 0 12px;font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h2 .grow{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-weight:600;font-size:.85rem;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:5px 13px;cursor:pointer}
.chip.on{background:var(--amber);border-color:var(--amber);color:#2A1A00}
.chip em{font-style:normal;opacity:.7;margin-left:5px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:12px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.box{background:var(--surface);border-radius:20px;padding:16px;min-width:0}
.bars{display:flex;align-items:flex-end;gap:5px;height:96px}
.bars i{flex:1;min-width:4px;border-radius:5px 5px 2px 2px;background:var(--coral);min-height:3px}
.bars i.zero{background:var(--raised)}
.axis{display:flex;justify-content:space-between;color:var(--faint);font-size:.75rem;margin-top:8px}
.big{font-size:2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:3px;margin:12px 0}
.split i{display:block}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:.9rem;color:var(--muted)}
.leg b{color:var(--text);font-variant-numeric:tabular-nums}
.dt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.list{background:var(--surface);border-radius:20px;overflow:hidden}
.item{display:flex;gap:12px;padding:14px 16px;border-top:1px solid rgba(255,255,255,.06);align-items:flex-start}
.item:first-child{border-top:0}
.item.done{opacity:.55}
.stripe{width:4px;align-self:stretch;border-radius:4px;flex:none}
.k-bug{background:var(--coral)}.k-idea{background:var(--amber)}.k-love{background:var(--ok)}
.body{flex:1;min-width:0}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.meta{margin-top:5px;color:var(--faint);font-size:.8rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta a{color:var(--amber);text-decoration:none;font-weight:600}
.tag{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1px solid}
.t-bug{color:var(--coral)}.t-idea{color:var(--amber)}.t-love{color:var(--ok)}
.sev1{background:var(--coral);color:#2A0F0A;border-color:var(--coral)}
.acts{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
select,input[type=search]{font:inherit;font-size:.85rem;font-weight:600;background:var(--raised);color:var(--text);border:0;border-radius:99px;padding:6px 12px}
input[type=search]{min-width:170px;padding:8px 14px}
.empty{padding:28px 16px;text-align:center;color:var(--faint)}
.empty b{display:block;color:var(--muted);font-size:1.05rem;margin-bottom:4px}
.crash b{display:block}.crash code{font:.8rem ui-monospace,monospace;color:var(--faint)}
.ct{font-weight:800;color:var(--coral);font-variant-numeric:tabular-nums;font-size:1.1rem}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-weight:600;color:var(--blush);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;text-align:left;padding:12px 16px}
td{padding:10px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:.92rem}
td.n{color:var(--faint);white-space:nowrap}
.add{font:inherit;font-size:.8rem;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:3px 12px;cursor:pointer}
.add.is{background:var(--ok);border-color:var(--ok);color:#0E2A1B}
.x{background:none;border:0;color:var(--faint);cursor:pointer;font:inherit;font-size:1.1rem;padding:2px 8px;border-radius:8px}
.x:hover,.x.sure{color:var(--coral)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--ground);padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style></head><body>
<div class="sky"><div class="wrap"><div class="top">
  <div><h1>Beta</h1><div class="sub"><span class="dot"></span><span id="upd">Loading</span></div></div>
  <button class="btn go" id="refresh">Refresh</button>
</div></div></div>
<main>
<div class="gates" id="gates"></div>
<div class="hero" id="hero"></div>

<h2>Testers</h2>
<div class="two">
  <div class="box"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px"><div><div class="lab">Signups</div><div class="big" id="total">0</div></div><div class="lab" id="week"></div></div><div class="bars" id="bars" style="margin-top:14px"></div><div class="axis"><span id="a0"></span><span id="a1"></span></div></div>
  <div class="box"><div class="lab">Devices</div><div class="split" id="split"></div><div class="leg" id="leg"></div></div>
</div>

<h2>Feedback <span class="grow"></span><span class="chips" id="fchips"></span></h2>
<div class="list" id="fb"></div>

<h2>Crashes</h2>
<div class="list" id="cr"></div>

<h2>Signups <span class="grow"></span><input type="search" id="q" placeholder="Search"><span class="chips" id="tchips"></span><button class="pill" id="copy">Copy emails</button></h2>
<div class="list tbl"><table id="tt"></table></div>
</main>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const ago=s=>{const d=Date.now()/1000-s;return d<90?"now":d<3600?(d/60|0)+"m":d<86400?(d/3600|0)+"h":(d/86400|0)+"d"};
const PL={android:"Android",ios:"iPhone / iPad",iphone:"iPhone",ipad:"iPad",mac:"Mac"},COL={android:"var(--android)",ios:"var(--ios)",iphone:"var(--ios)",ipad:"var(--ipad)",mac:"var(--mac)"};
const GATES=[["Installed","installed",70],["Activated","activated",60],["Day 7","retained",40],["Crash-free","crashFree",99],["Very disappointed","veryDisappointed",40]];
let D,ff="new",tf="all",q="",armed=null,loaded=0;
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1600)};
const post=(u,b)=>fetch(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}).then(async r=>{const j=await r.json().catch(()=>({}));if(j.invited)toast("Invited to TestFlight");else if(!r.ok)toast("TestFlight said no");return load()});
const chips=(box,opts,cur,set)=>box.replaceChildren(...opts.map(([k,l,n])=>{const c=el("button","chip"+(k===cur?" on":""),l);if(n!=null)c.append(el("em","",n));c.onclick=()=>{set(k);draw()};return c}));
const empty=(a,b)=>{const d=el("div","empty");d.append(el("b","",a),b);return d};

function draw(){
 const m=D.metrics;let met=0;
 $("gates").replaceChildren(...GATES.map(([l,k,t])=>{const v=m[k],ok=v!=null&&v>=t;if(ok)met++;
  const x=el("div","tile "+(v==null?"none":ok?"met":"miss"));
  const val=el("div","val",v==null?"–":v);if(v!=null)val.append(el("small","","%"));
  const mt=el("div","meter"),f=el("i"),tick=el("b");f.style.width=Math.min(100,v||0)+"%";tick.style.left=t+"%";mt.append(f,tick);
  x.append(el("div","lab",l),val,mt,el("div","tgt","Target "+t+"%"));return x}));
 const s1=m.openSev1,h=$("hero");
 h.replaceChildren();const a=el("strong","",met+" of 5 gates met");h.append(a,el("span","",s1?" · "+s1+" open sev 1":" · no open sev 1"));
 const ms=(D.missed||[]);if(ms.length)h.append(el("span","",' · '+ms.reduce((t,x)=>t+x.c,0)+" missed alarms ("+ms.map(x=>(PL[x.platform]||x.platform)+" "+x.c).join(", ")+")"));
 // signups
 $("total").textContent=D.signups.length;
 const days=[];for(let i=13;i>=0;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);days.push([d,0])}
 D.perDay.forEach(p=>{const t=days.find(x=>x[0]===p.d);if(t)t[1]=p.c});
 const mx=Math.max(1,...days.map(x=>x[1]));
 $("bars").replaceChildren(...days.map(([d,c])=>{const i=el("i",c?"":"zero");i.style.height=Math.max(3,c/mx*100)+"%";i.title=d+": "+c;return i}));
 $("a0").textContent="14 days ago";$("a1").textContent="Today";
 const wk=days.slice(-7).reduce((s,x)=>s+x[1],0);$("week").textContent="+"+wk+" this week";
 const tot=D.signups.length||1,sp=$("split"),lg=$("leg");sp.replaceChildren();lg.replaceChildren();
 for(const p of Object.keys(D.platforms)){const n=D.platforms[p],i=el("i");i.style.width=(n/tot*100)+"%";i.style.background=COL[p]||"var(--faint)";sp.append(i);
  const r=el("span"),d=el("i","dt");d.style.background=COL[p]||"var(--faint)";r.append(d,(PL[p]||p)+" ",el("b","",n));lg.append(r)}
 // feedback
 const F=D.feedback,cnt=f=>F.filter(f).length;
 chips($("fchips"),[["new","New",cnt(x=>x.status==="new")],["bug","Bugs",cnt(x=>x.kind==="bug")],["idea","Ideas",cnt(x=>x.kind==="idea")],["love","Love",cnt(x=>x.kind==="love")],["all","All",F.length]],ff,v=>ff=v);
 const fl=F.filter(f=>ff==="all"||(ff==="new"?f.status==="new":f.kind===ff));
 $("fb").replaceChildren(...(fl.length?fl.map(feedbackItem):[empty(F.length?"Nothing here":"No feedback yet","Testers send it from Settings > Beta")]));
 // crashes
 $("cr").replaceChildren(...(D.crashes.length?D.crashes.map(c=>{const r=el("div","item crash"),g=el("div","body");
  g.append(el("b","",c.detail||"Crash"),el("code","",[PL[c.platform]||c.platform,c.version].filter(Boolean).join(" · ")));
  r.append(g,el("span","ct",c.c+"×"),el("span","meta",c.u+" installs · "+ago(c.last)));return r}):[empty("No crashes","From testers who share how they use the app")]));
 // testers
 const S=D.signups;
 chips($("tchips"),[["all","All",S.length],["todo","To add",S.filter(x=>!x.added).length],...Object.keys(PL).filter(p=>D.platforms[p]).map(p=>[p,PL[p],D.platforms[p]])],tf,v=>tf=v);
 const tl=S.filter(s=>(tf==="all"||(tf==="todo"?!s.added:s.platform===tf))&&s.email.includes(q));
 window.__shown=tl;
 const tb=el("tbody"),hd=el("tr");["Email","Device","Signed up","Added",""].forEach(x=>hd.append(el("th","",x)));tb.append(hd);
 tl.forEach(s=>{const r=el("tr");r.append(el("td","",s.email),el("td","",PL[s.platform]||s.platform),el("td","n",ago(s.created_at)));
  const a=el("td"),b=el("button","add"+(s.added?" is":""),s.added?"Added":"Add");b.onclick=()=>post("/admin/api/signup",{id:s.id,added:!s.added});a.append(b);
  const d=el("td"),x=el("button","x"+(armed==="s"+s.id?" sure":""),armed==="s"+s.id?"Delete?":"×");x.title="Delete";
  x.onclick=()=>{if(armed==="s"+s.id){armed=null;post("/admin/api/signup",{id:s.id,delete:true})}else{armed="s"+s.id;draw()}};d.append(x);r.append(a,d);tb.append(r)});
 if(!tl.length){const r=el("tr"),c=el("td","");c.colSpan=5;c.append(empty(S.length?"Nobody matches":"No signups yet","The form on quando.day/beta fills this list"));r.append(c);tb.append(r)}
 $("tt").replaceChildren(tb);
}
function feedbackItem(f){
 const r=el("div","item"+(["done","wont"].includes(f.status)?" done":""));
 r.append(el("i","stripe k-"+f.kind));
 const b=el("div","body"),top=el("div","txt");top.textContent=f.body;
 const m=el("div","meta");m.append(el("span","tag t-"+f.kind,f.kind));
 if(f.kind==="bug"&&f.severity===1)m.append(el("span","tag sev1","Sev 1"));
 m.append(el("span","",[PL[f.platform]||f.platform,f.version].filter(Boolean).join(" · ")),el("span","",ago(f.created_at)));
 if(f.contact){const a=el("a","","Reply");a.href="mailto:"+encodeURIComponent(f.contact).replace(/%40/g,"@");m.append(a)}
 b.append(top,m);
 const acts=el("div","acts");
 if(f.kind==="bug"){const sv=el("select");[["","Sev"],[1,"Sev 1"],[2,"Sev 2"],[3,"Sev 3"]].forEach(([v,l])=>{const o=el("option","",l);o.value=v;if(v==f.severity)o.selected=true;sv.append(o)});sv.onchange=()=>post("/admin/api/feedback",{id:f.id,severity:+sv.value});acts.append(sv)}
 const st=el("select");[["new","New"],["now","Now"],["next","Next"],["later","Later"],["wont","Won't"],["done","Done"]].forEach(([v,l])=>{const o=el("option","",l);o.value=v;if(v===f.status)o.selected=true;st.append(o)});st.onchange=()=>post("/admin/api/feedback",{id:f.id,status:st.value});acts.append(st);
 const x=el("button","x"+(armed==="f"+f.id?" sure":""),armed==="f"+f.id?"Delete?":"×");x.title="Delete";
 x.onclick=()=>{if(armed==="f"+f.id){armed=null;post("/admin/api/feedback",{id:f.id,delete:true})}else{armed="f"+f.id;draw()}};acts.append(x);
 r.append(b,acts);return r}
async function load(){
 try{const r=await fetch("/admin/api/data");if(!r.ok){$("upd").textContent="No access";return}
  D=await r.json();loaded=Date.now();draw()}catch{$("upd").textContent="Offline"}}
setInterval(()=>{if(loaded)$("upd").textContent="Updated "+(Date.now()-loaded<90000?"just now":ago(loaded/1000)+" ago")},15000);
$("refresh").onclick=()=>{load().then(()=>{$("upd").textContent="Updated just now"})};
$("q").oninput=e=>{q=e.target.value.trim().toLowerCase();if(D)draw()};
$("copy").onclick=async()=>{const t=(window.__shown||[]).map(s=>s.email).join("\n");if(!t)return toast("Nothing to copy");
 try{await navigator.clipboard.writeText(t);toast("Copied "+window.__shown.length+" emails")}catch{toast("Copy blocked")}};
load().then(()=>{if(D)$("upd").textContent="Updated just now"});setInterval(load,60000);
</script></body></html>
