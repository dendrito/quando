name: quando
description: "Quando?: alarms for the moments that matter. If not now, when?"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  alarm: ^5.15.0
  cloud_firestore: ^6.0.0
  crypto: ^3.0.6
  cryptography: ^2.9.0
  device_calendar_plus: ^0.12.0
  file_picker: ^13.3.2
  firebase_auth: ^6.0.0
  firebase_core: ^4.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  flutter_web_auth_2: ^5.1.0
  font_awesome_flutter: ^11.0.0
  geolocator: ^14.1.2
  go_router: ^18.1.2
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: any
  just_audio: ^0.10.6
  kiosk_mode: ^0.10.0
  kosher_dart: ^2.0.20
  mobile_scanner: ^7.5.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  record: ^7.1.2
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  spotify_sdk: ^4.3.4
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.2

# Quando's copy of the alarm plugin: it can also ring an online radio
# stream, falling back to the phone's alarm sound. See packages/alarm.
dependency_overrides:
  alarm:
    path: packages/alarm

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/brands/
    - third_party/suncalc/LICENSE
    - third_party/astronomia/LICENSE
    - third_party/hebcal/LICENSE
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
