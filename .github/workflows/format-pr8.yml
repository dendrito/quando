name: Format PR 8 Dart files

on:
  push:
    branches:
      - feat/reminder-delivery-m1
    paths:
      - .github/workflows/format-pr8.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reminder-delivery-m1
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply Dart formatting
        run: dart format lib test
      - name: Commit formatting changes
        run: |
          if git diff --quiet -- lib test; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: apply Dart formatter"
          git push origin HEAD:feat/reminder-delivery-m1
