name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: quando-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Publish as the "latest" download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk quando-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest quando-debug.apk \
            --prerelease \
            --title "Latest test build" \
            --notes "Debug build of ${GITHUB_SHA::7}. Download quando-debug.apk and install it on an Android phone."
        env:
          GH_TOKEN: ${{ github.token }}
