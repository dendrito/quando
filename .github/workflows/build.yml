name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

      - name: Build release APKs (one per phone type, much smaller)
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: quando-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 14

      - name: Publish as the "latest" download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk quando.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk quando-older-phones.apk
          ls -lh quando*.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest quando.apk quando-older-phones.apk \
            --prerelease \
            --title "Latest test build" \
            --notes "Test build of ${GITHUB_SHA::7}. Most phones: quando.apk. Phones from before about 2017: quando-older-phones.apk."
        env:
          GH_TOKEN: ${{ github.token }}
