name: Board sync

# Keeps the project board's cards in step with pull requests.
# Safe by design: it checks out main (never the pull request's code) and only
# reads the event data to write a small JSON card file.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: write
  actions: write

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update the card
        run: python3 dashboard/sync_pr.py
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "board-sync"
          git config user.email "board-sync@users.noreply.github.com"
          git add dashboard/cards
          if git diff --cached --quiet; then echo "nothing to do"; exit 0; fi
          git commit -m "Board: sync PR #${PR_NUMBER}"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i * 3))
          done
          # Pushes made with the built-in token do not start other workflows, so start the site build by hand.
          gh workflow run dashboard.yml --ref main
